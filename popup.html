<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup loading">
  <div class="stripe" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <main class="content reveal">
    <h1 class="brand"><img src="assets/icon.svg" alt="" draggable="false" width="26" height="26">LocalView</h1>

    <div id="scope" class="seg" role="radiogroup" hidden>
      <button type="button" role="radio" data-scope="all" data-i18n="scope_everywhere">Everywhere</button>
      <button type="button" role="radio" data-scope="product" id="scope-product"></button>
    </div>
    <p id="scope-note" class="scope-note" hidden></p>
    <div id="chips" class="chips" hidden></div>
    <div id="fields" class="fields">
    <label class="row">
      <span class="label"><svg class="row-icon blue" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="M3.5 9h17"/></svg><span data-i18n="label_interface_language">Display language</span></span>
      <select id="interfaceLanguage" class="pill-select"></select>
      <span class="hint" id="hint-interfaceLanguage" data-i18n="hint_interface_language">Language of Google’s menus and buttons</span>
    </label>
    <label class="row">
      <span class="label"><svg class="row-icon red" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg><span data-i18n="label_results_language">Results language</span></span>
      <select id="resultsLanguage" class="pill-select"></select>
      <span class="hint" id="hint-resultsLanguage" data-i18n="hint_results_language">Shows only pages written in this language</span>
    </label>
    <label class="row">
      <span class="label"><svg class="row-icon green" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s6.5-5.6 6.5-10.5a6.5 6.5 0 0 0-13 0c0 4.9 6.5 10.5 6.5 10.5z"/><circle cx="12" cy="10" r="2.3"/></svg><span data-i18n="label_region">Region</span></span>
      <select id="region" class="pill-select"></select>
      <span class="hint" id="hint-region" data-i18n="hint_region">Country whose results and prices come first</span>
    </label>
    </div>

    <div class="actions">
      <button id="apply" class="pill primary" data-i18n="button_apply">Apply</button>
      <button id="reset" class="pill" data-i18n="button_reset">Reset</button>
      <button id="save-open" class="pill icon-pill" hidden><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5h10a1 1 0 0 1 1 1v14l-6-4-6 4v-14a1 1 0 0 1 1-1z"/></svg><span class="sr-only" data-i18n="button_save">Save</span></button>
    </div>

    <form id="save-form" class="save-row" hidden>
      <input type="text" id="preset-name" class="pill-input" data-i18n-label="label_preset_name" maxlength="40" data-i18n-placeholder="label_preset_name" autocomplete="off">
      <button type="submit" class="pill primary small" data-i18n="button_save">Save</button>
      <button type="button" id="save-cancel" class="pill small" data-i18n="button_cancel">Cancel</button>
    </form>

    <div class="footer">
      <p id="status" class="status" role="status"></p>
      <a href="#" id="settings" class="text-link"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span data-i18n="link_settings">Settings</span></a>
    </div>
  </main>

  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
